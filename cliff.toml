# git-cliff config — https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md and GitHub release notes from Conventional Commits.

[changelog]
header = """
# Changelog

All notable changes to Auctioneer are documented here.
This file is generated from commit messages by [git-cliff](https://git-cliff.org).\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/Fm-s/wow-forever-auction-partner
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]\
({{ self::remote_url() }}/releases/tag/{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
  {% if commit.breaking %}💥 **BREAKING** {% endif -%}
  {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
  ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}

{% if previous.version and version -%}
**Full diff:** [{{ previous.version }}...{{ version }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
footer = ""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+.*$"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Fm-s/wow-forever-auction-partner/pull/${2}))" },
]
commit_parsers = [
  { message = "^(fix|feat)\\(security\\)", group = "<!-- 1 -->🛡️ Security" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 8 -->📦 Dependencies" },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^test", group = "<!-- 5 -->🧪 Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->🏗️ Build & CI" },
  { message = "^style", group = "<!-- 7 -->🎨 Style" },
  { message = "^chore", group = "<!-- 9 -->🧹 Chores" },
]
